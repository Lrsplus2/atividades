<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão de Atividades</title>
<meta name="theme-color" content="#10233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atividades">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--pri:#2F63F5;--esc:#10233F;--dst:#16A6A1;--bg:#F3F5F9;--card:#fff;--txt:#14213D;--mut:#667085;--bor:#E2E6EE;--err:#C62828;--ok:#1B8A4B;--warn:#B26A00}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--bg:#0B1424;--card:#121E33;--txt:#E8EDF7;--mut:#9AA7BD;--bor:#22314D}}
:root[data-tema="escuro"]{--bg:#0B1424;--card:#121E33;--txt:#E8EDF7;--mut:#9AA7BD;--bor:#22314D}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hide{display:none!important}
/* login */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--esc),#1B3A66)}
.box{background:var(--card);border-radius:16px;padding:28px;width:100%;max-width:400px;box-shadow:0 10px 40px #0006}
.box h1{margin:8px 0 2px;font-size:22px}
.box p.sub{margin:0 0 18px;color:var(--mut);font-size:13px}
.logo-app{width:64px;height:64px;border-radius:16px;display:block}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bor);border-radius:10px;background:var(--card)}
input[type=color]{height:42px;padding:3px}
input[type=file]{padding:6px;font-size:12px;max-width:100%}
.logo-ed input[type=file]{flex:1;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--bor)}
.btn.lnk{background:none;color:var(--pri);padding:6px 4px;font-weight:500}
.btn.red{background:var(--err)}
.btn:disabled{opacity:.55;cursor:default}
.full{width:100%;margin-top:16px}
.links{display:flex;justify-content:space-between;margin-top:10px;font-size:13px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px}
.msg.err{background:#C628281a;color:var(--err)}.msg.ok{background:#1B8A4B1a;color:var(--ok)}.msg.inf{background:#2F63F51a;color:var(--pri)}
.ver{margin-top:16px;text-align:center;font-size:11px;color:var(--mut)}
/* app */
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--esc);color:#fff;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.brand img{width:36px;height:36px;border-radius:9px}
.brand b{font-size:15px;line-height:1.1}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:#cfd8ea;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.nav button.on,.nav button:hover{background:#ffffff1a;color:#fff}
.side .grow{flex:1}
.side .who{font-size:12px;color:#9fb0cf;padding:8px 10px;border-top:1px solid #ffffff22}
.side .who b{display:block;color:#fff;font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bor);position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:18px;flex:1}
.logos{display:flex;gap:8px;align-items:center}
.logos img{height:26px;max-width:90px;object-fit:contain}
.bell{position:relative;background:none;border:0;font-size:20px;cursor:pointer;padding:4px 8px}
.bell i{position:absolute;top:-2px;right:0;background:var(--err);color:#fff;border-radius:9px;font:700 10px/1 system-ui;padding:3px 5px;font-style:normal}
.content{padding:20px;max-width:1100px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bor);border-radius:14px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bor);border-radius:14px;padding:14px}
.kpi b{font-size:26px;display:block}.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bor);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em}
tr.cl{cursor:pointer}tr.cl:hover td{background:#2F63F50d}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#2F63F51f;color:var(--pri)}
.tag.adm{background:#16A6A126;color:var(--dst)}.tag.ges{background:#B26A001f;color:var(--warn)}.tag.off{background:#C628281f;color:var(--err)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input,.bar select{width:auto;flex:1;min-width:140px}
.tw{overflow-x:auto}
.mask{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.logo-ed{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}
.logo-ed .pv{width:120px;height:48px;border:1px dashed var(--bor);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);overflow:hidden}
.logo-ed .pv img{max-width:100%;max-height:100%}
.notif{position:absolute;right:12px;top:52px;width:min(360px,calc(100vw - 24px));background:var(--card);border:1px solid var(--bor);border-radius:14px;box-shadow:0 10px 30px #0004;max-height:70vh;overflow:auto;z-index:20}
.notif div{padding:10px 14px;border-bottom:1px solid var(--bor);font-size:13px}
.notif div.nl{background:#2F63F50f}.notif small{color:var(--mut);display:block}
.soon{color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--esc);color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:13px}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.quick input,.quick select{width:auto;flex:1;min-width:130px}.quick #qt{flex:3;min-width:220px}
.abas{display:flex;gap:6px;margin-bottom:10px}.abas button{background:var(--card);border:1px solid var(--bor);border-radius:20px;padding:6px 14px;cursor:pointer}.abas button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ck{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--txt);font-weight:400}.bar .ck input,.ck input{flex:none;min-width:0;width:auto}.bar .ck{flex:none}
.atv{background:var(--card);border:1px solid var(--bor);border-left:4px solid var(--bor);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}.atv:hover{border-color:var(--pri)}
.atv.pr-alta{border-left-color:var(--warn)}.atv.pr-urgente,.atv.late{border-left-color:var(--err)}
.l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.l2{font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 14px;justify-content:space-between}.l2 .r{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
.tag.pr{background:#B26A001f;color:var(--warn)}.tag.nw{background:#16A6A126;color:var(--dst)}
.tag.st-concluida{background:#1B8A4B1f;color:var(--ok)}.tag.st-recusada,.tag.st-cancelada,.tag.st-bloqueada{background:#C628281f;color:var(--err)}.tag.st-rascunho{background:#6670501a;color:var(--mut)}
.quick .qp{flex:1;min-width:130px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.cl{cursor:pointer}.kpi.cl:hover{border-color:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:#2F63F51f;color:var(--pri);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer}
.exl{max-height:180px;overflow:auto;border:1px solid var(--bor);border-radius:10px;padding:4px 8px}.ex{display:flex;gap:8px;align-items:center;margin:0;padding:5px 0;font-size:13px;color:var(--txt);font-weight:400}.ex input{width:auto}.ex small{color:var(--mut)}
.modal.det{max-width:720px}.desc{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.dabas{margin:14px 0 6px}
.ckl{margin:12px 0}.cki{display:flex;gap:8px;align-items:center;margin:0;padding:4px 0;font-size:14px;color:var(--txt);font-weight:400}.cki input[type=checkbox]{width:auto;flex:none;margin:0}.cki span{flex:1;min-width:0}.cki .btn{flex:none;padding:2px 8px}.cki .done{text-decoration:line-through;color:var(--mut)}.cka{display:flex;gap:8px;margin-top:6px}.cka input{flex:1}.prog{height:5px;background:var(--bor);border-radius:3px;margin:4px 0 6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.tl .ev{padding:6px 0;border-bottom:1px solid var(--bor);font-size:13px}.tl small{color:var(--mut);display:block}
.cmt{display:flex;gap:8px;margin-top:12px;align-items:flex-end}.cmt textarea{flex:1}
h4{margin:14px 0 6px}
.bnav{display:none}
@media (max-width:760px){
 .side{display:none}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--esc);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
 .bnav button{flex:1;background:none;border:0;color:#cfd8ea;font-size:11px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
 .bnav button.on{color:#fff}.bnav button span{font-size:19px}
 .content{padding:14px 14px 90px}.top{padding:10px 14px}.logos{display:none}.row2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="boot" style="padding:40px;text-align:center;color:#667085">Carregando…</div>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===================== CONFIGURAÇÃO (alterar aqui ao migrar de servidor) ===================== */
const CFG = {
  SUPABASE_URL: 'https://batuyemqyhiervikpojn.supabase.co',
  SUPABASE_KEY: 'sb_publishable_Yr0xTCnw5SN2BYOUNm1_0Q_uOKWc1s5',
  VERSAO: 'v1.6', DATA: '24/10/2026',
  EMPRESAS: ['CHOICE','SAG','PORTWELL','GRUPO']
};
/* ============================================================================================== */
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {eu:null, cfg:{app:{}, logos:{}}, tela:'inicio', users:[], notifs:[], recovery:false};
const root = $('#root');
const ICON = 'icon-192.png';
function resetEstado(){
  if(canal){try{sb.removeChannel(canal)}catch(e){}canal=null}
  document.querySelectorAll('.mask,.notif,.toast').forEach(e=>e.remove());
  S.eu=null;S.admin=false;S.tela='inicio';S.users=[];S.notifs=[];S.atvs=[];S.aba='para_mim';S.aberta=null;
  S.fil={q:'',st:'',pr:'',emp:'',dest:'',atr:false,tema:''};S.temas=[];S.qsel=null;
}
const PERFIL = {colaborador:'Colaborador', gestor:'Gestor', admin:'Administrador'};

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function traduz(e){const m=(e&&e.message)||String(e);
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'E-mail ainda não confirmado. Verifique sua caixa de entrada.';
  if(/already registered/i.test(m))return 'Este e-mail já possui acesso. Use "Entrar" ou "Esqueci a senha".';
  if(/Password should be/i.test(m))return 'A senha deve ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos.';
  return m}
function aplicaTema(){
  const a=S.cfg.app||{}, r=document.documentElement.style;
  if(a.cor_primaria)r.setProperty('--pri',a.cor_primaria);
  if(a.cor_escura)r.setProperty('--esc',a.cor_escura);
  if(a.cor_destaque)r.setProperty('--dst',a.cor_destaque);
  document.title=a.nome||'Gestão de Atividades';
}
const nomeApp=()=>S.cfg.app?.nome||'Gestão de Atividades';
const logosHtml=()=>CFG.EMPRESAS.map(e=>S.cfg.logos?.[e]?`<img src="${esc(S.cfg.logos[e])}" alt="${esc(e)}">`:'').join('');
const verHtml=()=>`<div class="ver">${CFG.VERSAO} · ${CFG.DATA}</div>`;

/* ---------- LOGIN ---------- */
function telaLogin(modo='entrar',aviso=''){
  const rec = modo==='recuperar', nova = modo==='nova', pri = modo==='primeiro';
  root.innerHTML=`<div class="login"><form class="box" id="f">
   <img class="logo-app" src="${ICON}" alt="">
   <h1>${esc(nomeApp())}</h1>
   <p class="sub">${nova?'Defina sua senha pessoal':rec?'Redefinição de senha':'Entre com seu e-mail e senha. Primeiro acesso? Solicite ao administrador.'}</p>
   ${(nova||rec)?'':`<label>E-mail</label><input id="em" type="email" autocomplete="username" required>`}
   ${rec?'':`<label>${nova?'Nova senha':'Senha'}</label><input id="pw" type="password" autocomplete="${(pri||nova)?'new-password':'current-password'}" minlength="${nova?8:6}" required>`}
   ${rec?'':`<button class="btn full" id="ok">${nova?'Salvar senha (mín. 8 caracteres)':'Entrar'}</button>`}
   <div id="m">${aviso?`<div class="msg inf">${esc(aviso)}</div>`:''}${rec?'<div class="msg inf">Solicite ao administrador do sistema a redefinição da sua senha. Ele gerará uma senha provisória e, no próximo acesso, você definirá uma nova.</div>':''}</div>
   <div class="links">${modo==='entrar'?`<a href="#" data-m="recuperar">Esqueci a senha</a><span></span>`:nova?`<a href="#" id="sairn">Sair</a><span></span>`:`<a href="#" data-m="entrar">← Voltar ao login</a><span></span>`}</div>
   ${verHtml()}</form></div>`;
  root.querySelectorAll('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();telaLogin(a.dataset.m)});
  if($('#sairn'))$('#sairn').onclick=e=>{e.preventDefault();sair()};
  $('#f').onsubmit=async ev=>{ev.preventDefault();const b=$('#ok'),m=$('#m');b.disabled=true;m.innerHTML='';
    try{
      const em=($('#em')?.value||'').trim().toLowerCase(), pw=$('#pw')?.value;
      if(nova){const {error}=await sb.auth.updateUser({password:pw,data:{atv_trocar_senha:false}});if(error)throw error;S.recovery=false;history.replaceState(null,'',location.pathname);await iniciar();return}
      if(rec){const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error)throw error;m.innerHTML='<div class="msg ok">Se o e-mail estiver cadastrado, você receberá o link em instantes.</div>';b.disabled=false;return}
      if(pri){const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(data.session){await iniciar();return}
        m.innerHTML='<div class="msg ok">Acesso criado. Enviamos um e-mail de confirmação; confirme-o e depois entre normalmente.</div>';b.disabled=false;return}
      const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;await iniciar();
    }catch(e){m.innerHTML=`<div class="msg err">${esc(traduz(e))}</div>`;b.disabled=false}
  };
}

/* ---------- INÍCIO / SESSÃO ---------- */
async function carregaCfg(){
  try{const {data}=await sb.from('atv_config').select('chave,valor');(data||[]).forEach(r=>{S.cfg[r.chave]=r.valor});}catch(e){}
  aplicaTema();
}
async function iniciar(){
  resetEstado();
  const {data:{session}}=await sb.auth.getSession();
  if(!session){telaLogin();return}
  if(session.user.user_metadata?.atv_trocar_senha===true){telaLogin('nova','Defina uma senha pessoal para continuar.');return}
  const {data:id,error}=await sb.rpc('atv_eu');
  if(error){telaBloqueio('Não foi possível validar seu acesso: '+traduz(error));return}
  if(!id){telaBloqueio('Seu e-mail ('+esc(session.user.email)+') não está cadastrado ou ativo neste sistema, ou ainda não foi confirmado. Procure um administrador.');return}
  const {data:u}=await sb.from('atv_usuario').select('*').eq('id',id).single();
  const {data:adm}=await sb.rpc('atv_admin');
  S.eu=u; S.admin=!!adm; if(S.admin)S.eu.perfil_efetivo='admin';
  await carregaCfg();
  const {data:us}=await sb.from('atv_usuario').select('*').order('nome');S.users=us||[];
  await carregaNotifs();await carregaTemas();
  assina();
  renderApp();
}
function telaBloqueio(txt){
  root.innerHTML=`<div class="login"><div class="box"><img class="logo-app" src="${ICON}" alt=""><h1>${esc(nomeApp())}</h1>
  <div class="msg err">${txt}</div><button class="btn full" id="sair">Sair</button>${verHtml()}</div></div>`;
  $('#sair').onclick=sair;
}
async function sair(){await sb.auth.signOut();resetEstado();telaLogin()}

/* ---------- NOTIFICAÇÕES (tempo real) ---------- */
async function carregaNotifs(){
  const {data}=await sb.from('atv_notificacao').select('*').order('criada_em',{ascending:false}).limit(30);S.notifs=data||[];
}
let canal=null;
function assina(){
  if(canal)sb.removeChannel(canal);
  let tm=null;const rf=()=>{clearTimeout(tm);tm=setTimeout(async()=>{await carregaAtvs();await carregaTemas();if(S.tela==='atividades'&&!$('#det'))mostra();else if(S.tela==='inicio'&&!$('#det'))mostra();if(S.aberta)pintaDet()},400)};
  canal=sb.channel('atv-rt').on('postgres_changes',{event:'*',schema:'public',table:'atv_notificacao'},async()=>{await carregaNotifs();atualizaBell()})
   .on('postgres_changes',{event:'*',schema:'public',table:'atv_atividade'},rf).on('postgres_changes',{event:'*',schema:'public',table:'atv_atribuicao'},rf)
   .on('postgres_changes',{event:'*',schema:'public',table:'atv_comentario'},rf).on('postgres_changes',{event:'*',schema:'public',table:'atv_evento'},rf).on('postgres_changes',{event:'*',schema:'public',table:'atv_anexo'},rf).subscribe();
}
function atualizaBell(){const n=S.notifs.filter(x=>!x.lida).length;const b=$('#bell');if(b)b.innerHTML='🔔'+(n?`<i>${n>99?'99+':n}</i>`:'')}
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const ehIos=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const instalado=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const b64u=k=>{const p='='.repeat((4-k.length%4)%4),r=atob((k+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function pushSub(){try{const r=await Promise.race([navigator.serviceWorker.ready,new Promise((_,x)=>setTimeout(x,3000))]);return await r.pushManager.getSubscription()}catch(e){return null}}
async function ativaPush(){
  const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Permissão negada. Libere as notificações nas configurações do navegador.');return false}
  const {data,error}=await sb.functions.invoke('atv-push',{body:{acao:'chave'}});if(error||!data?.chave){toast('Não foi possível ativar agora');return false}
  const r=await navigator.serviceWorker.ready;let sub=await r.pushManager.getSubscription();
  if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(data.chave)});
  const j=sub.toJSON();const {error:e2}=await sb.rpc('atv_push_salvar',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent});
  if(e2){toast(traduz(e2));return false}toast('Notificações ativadas neste dispositivo');return true}

const ASTATUS={aguardando:'Aguardando aceite',em_andamento:'Em andamento',bloqueada:'Bloqueada',concluida:'Concluída',recusada:'Recusada',cancelada:'Cancelada'};
const PRIO={normal:'Normal',alta:'Alta',urgente:'Urgente'};
const ABERTAS=['aguardando_aceite','em_andamento','bloqueada','parcialmente_concluida'];
const fmtDt=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const fmtD=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—';
function fmtDur(s){if(s==null)return '—';const m=Math.round(s/60),h=Math.floor(m/60);if(h<24)return `${h}h ${m%60}min`;return `${Math.floor(h/24)}d ${h%24}h`}
const uNome=id=>(S.users.find(u=>u.id===id)||{}).nome||'—';

const minhaAtr=a=>(a.atrib||[]).find(x=>x.executor_id===S.eu.id);
function filtra(){
  const f=S.fil,q=f.q.toLowerCase();
  let l=S.atvs.filter(a=>{
    if(S.aba==='para_mim'&&!(a.atrib||[]).some(x=>x.executor_id===S.eu.id))return false;
    if(S.aba==='que_pedi'&&a.solicitante_id!==S.eu.id)return false;
    if(S.aba==='rascunhos'&&!(a.status==='rascunho'))return false;
    if(S.aba!=='rascunhos'&&a.status==='rascunho'&&S.aba!=='que_pedi')return false;
    if(f.st&&a.status!==f.st)return false;
    if(f.pr&&a.prioridade!==f.pr)return false;
    if(f.tema&&(a.tema||'').trim().toLowerCase()!==f.tema.toLowerCase())return false;
    if(f.atr&&!atrasada(a))return false;
    if(f.dest&&!(a.atrib||[]).some(x=>x.executor_id===f.dest))return false;
    if(f.emp&&!((a.atrib||[]).some(x=>x.executor?.empresa===f.emp)||a.solicitante?.empresa===f.emp))return false;
    if(q&&!((a.titulo+' '+(a.descricao||'')+' '+(a.tema||'')+' '+a.solicitante?.nome+' '+(a.atrib||[]).map(x=>x.executor?.nome).join(' ')).toLowerCase().includes(q)))return false;
    return true});
  const pw={urgente:0,alta:1,normal:2};
  l.sort((x,y)=>(atrasada(y)-atrasada(x))||(pw[x.prioridade]-pw[y.prioridade])||((x.prazo?+new Date(x.prazo):9e15)-(y.prazo?+new Date(y.prazo):9e15)));

      const g=S.users.find(x=>x.id===u.gestor_id);
      return `<tr class="cl" data-id="${u.id}"><td>${esc(u.nome)}${u.ativo?'':' <span class="tag off">inativo</span>'}</td><td>${esc(u.email)}</td><td>${esc(u.empresa||'—')}</td><td>${esc(u.area||'')}</td><td><span class="tag ${u.perfil==='admin'?'adm':u.perfil==='gestor'?'ges':''}">${PERFIL[u.perfil]}</span></td><td>${ultAcesso(u)}</td><td>${acessoTxt(u)}</td></tr>`}).join('')||'<tr><td colspan="7">Nenhum resultado.</td></tr>';
    $('#tb').querySelectorAll('tr.cl').forEach(r=>r.onclick=()=>editaUsuario(S.users.find(u=>u.id===r.dataset.id)))};
  $('#q').oninput=lista;$('#fe').onchange=lista;$('#novo').onclick=()=>editaUsuario(null);$('#lote').onclick=acessosLote;lista();
  carregaAcessos().then(lista);
}
function editaUsuario(u){
  if(!S.admin)return;
  const novo=!u;u=u||{nome:'',email:'',area:'',funcao:'',empresa:'CHOICE',perfil:'colaborador',gestor_id:null,ativo:true};
  const m=document.createElement('div');m.className='mask';
  m.innerHTML=`<form class="modal"><h3>${novo?'Novo usuário':'Editar usuário'}</h3>
   <label>Nome</label><input id="n" value="${esc(u.nome)}" required>
   <label>E-mail (login)</label><input id="e" type="email" value="${esc(u.email)}" required ${novo?'':'readonly'}>
   <div class="row2"><div><label>Empresa</label><select id="emp">${CFG.EMPRESAS.map(x=>`<option ${x===u.empresa?'selected':''}>${x}</option>`).join('')}</select></div>
   <div><label>Perfil</label><select id="p">${Object.entries(PERFIL).map(([k,v])=>`<option value="${k}" ${k===u.perfil?'selected':''}>${v}</option>`).join('')}</select></div></div>
   <div class="row2"><div><label>Área</label><input id="a" value="${esc(u.area||'')}"></div><div><label>Função</label><input id="fu" value="${esc(u.funcao||'')}"></div></div>
   <label>Gestor</label><select id="g"><option value="">— Sem gestor —</option>${S.users.filter(x=>x.id!==u.id).map(x=>`<option value="${x.id}" ${x.id===u.gestor_id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>
   <label><input type="checkbox" id="at" style="width:auto" ${u.ativo?'checked':''}> Usuário ativo</label>
   ${novo?'':`<div class="acs" style="margin-top:10px"><button type="button" class="btn sec" id="ga">🔑 ${S.acessos[u.id]?.tem_acesso?'Redefinir senha':'Criar acesso'}</button> <span class="soon">${S.acessos[u.id]?.tem_acesso?'Já possui conta.':'Ainda sem conta.'}</span></div>`}
   <div id="m"></div><div class="acts"><button type="button" class="btn sec" id="x">Cancelar</button><button class="btn">Salvar</button></div></form>`;
  document.body.appendChild(m);$('#x',m).onclick=()=>m.remove();
  if($('#ga',m))$('#ga',m).onclick=()=>geraAcesso(u);
  $('form',m).onsubmit=async ev=>{ev.preventDefault();
    const row={nome:$('#n',m).value.trim(),empresa:$('#emp',m).value,perfil:$('#p',m).value,area:$('#a',m).value.trim()||null,funcao:$('#fu',m).value.trim()||null,gestor_id:$('#g',m).value||null,ativo:$('#at',m).checked};
    if(novo)row.email=$('#e',m).value.trim().toLowerCase();
    const q=novo?sb.from('atv_usuario').insert(row):sb.from('atv_usuario').update(row).eq('id',u.id);
    const {error}=await q;if(error){$('#m',m).innerHTML=`<div class="msg err">${esc(/duplicate/i.test(error.message)?'Já existe um usuário com este e-mail.':error.message)}</div>`;return}
    const {data}=await sb.from('atv_usuario').select('*').order('nome');S.users=data||[];m.remove();toast('Usuário salvo');mostra();
    if(novo){const nu=S.users.find(x=>x.email===row.email);if(nu&&confirm('Criar o acesso de '+nu.nome+' agora?'))geraAcesso(nu)}};
}

/* ---------- CONFIGURAÇÕES (admin) ---------- */
function reduzImg(file,max=240){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const i=new Image();i.onerror=ko;i.onload=()=>{
  const k=Math.min(1,max/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=Math.round(i.width*k);cv.height=Math.round(i.height*k);
  cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);ok(cv.toDataURL('image/png'))};i.src=r.result};r.readAsDataURL(file)})}
function vConfig(c){
  if(!S.admin){S.tela='inicio';return mostra()}
  const a=S.cfg.app||{},L={...(S.cfg.logos||{})};
  c.innerHTML=`<div class="card"><h3>Identidade</h3>
   <label>Nome do aplicativo</label><input id="nm" value="${esc(a.nome||'')}">
   <div class="row2"><div><label>Cor primária</label><input id="c1" type="color" value="${esc(a.cor_primaria||'#2F63F5')}"></div><div><label>Cor escura (menu)</label><input id="c2" type="color" value="${esc(a.cor_escura||'#10233F')}"></div></div>
   <label>Cor de destaque</label><input id="c3" type="color" value="${esc(a.cor_destaque||'#16A6A1')}"></div>
   <div class="card"><h3>Logotipos das empresas</h3><div class="soon">PNG ou JPG. A imagem é reduzida automaticamente.</div>
   ${CFG.EMPRESAS.filter(e=>e!=='GRUPO').map(e=>`<div class="logo-ed"><b style="width:90px">${e}</b><div class="pv" id="pv-${e}">${L[e]?`<img src="${esc(L[e])}">`:'sem logo'}</div><input type="file" accept="image/*" data-e="${e}" style="width:auto"><button type="button" class="btn lnk" data-r="${e}">Remover</button></div>`).join('')}</div>
   <button class="btn" id="sv">Salvar configurações</button><div id="m"></div>`;
  c.querySelectorAll('input[type=file]').forEach(f=>f.onchange=async()=>{if(!f.files[0])return;try{L[f.dataset.e]=await reduzImg(f.files[0]);$('#pv-'+f.dataset.e).innerHTML=`<img src="${L[f.dataset.e]}">`}catch(e){toast('Imagem inválida')}});
  c.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{L[b.dataset.r]=null;$('#pv-'+b.dataset.r).textContent='sem logo'});
  $('#sv').onclick=async()=>{
    const app={nome:$('#nm').value.trim()||'Gestão de Atividades',cor_primaria:$('#c1').value,cor_escura:$('#c2').value,cor_destaque:$('#c3').value};
    const {error}=await sb.from('atv_config').upsert([{chave:'app',valor:app,atualizado_em:new Date().toISOString()},{chave:'logos',valor:L,atualizado_em:new Date().toISOString()}]);
    if(error){$('#m').innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}
    S.cfg.app=app;S.cfg.logos=L;aplicaTema();toast('Configurações salvas');renderApp();S.tela='config';mostra()};
}

(async()=>{

  $('#boot').remove();

  await iniciar();
})();
